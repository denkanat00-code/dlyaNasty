<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДЛЯ АНАСТАСИЙКИ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #f3f7ee 0%, #e7f0dd 40%, #dcead0 70%, #e9f2e2 100%);
    color: #3e5a40;
    overflow-x: hidden;
    position: relative;
  }
  /* мягкие лепестки по углам */
  .petal {
    position: fixed; border-radius: 50% 50% 50% 0;
    opacity: .35; z-index: 0; pointer-events: none;
  }
  .p1 { width:180px; height:180px; background:#f6d7dc; top:-60px; left:-60px; transform:rotate(15deg); }
  .p2 { width:220px; height:220px; background:#f7ecc9; bottom:-80px; right:-70px; transform:rotate(200deg); }
  .p3 { width:150px; height:150px; background:#d7e8c8; top:40%; right:-70px; transform:rotate(90deg); }
  .p4 { width:130px; height:130px; background:#f6d7dc; bottom:15%; left:-55px; transform:rotate(-60deg); }

  .page { display:none; min-height:100vh; padding:40px 20px 80px; position:relative; z-index:2; }
  .page.active { display:block; animation: pageIn .8s ease-out; }
  @keyframes pageIn { from { opacity:0; transform:translateY(24px);} to { opacity:1; transform:translateY(0);} }

  h1 {
    text-align:center; font-size: clamp(30px, 6vw, 52px);
    color:#2c5e3a; letter-spacing:2px; margin: 10px 0 6px;
  }
  h2 { text-align:center; font-size: clamp(22px, 4vw, 32px); color:#2c5e3a; margin-bottom:8px; }
  .subtitle { text-align:center; font-size:18px; color:#5a755c; margin-bottom:26px; }

  /* ---- Цветочная эмблема ---- */
  .emblem {
    width: min(420px, 86vw); height: 200px;
    margin: 0 auto 8px; position: relative;
  }
  .flower { position:absolute; animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100%{ transform: rotate(-4deg);} 50%{ transform: rotate(4deg);} }
  .bloom { animation: bloom 1.6s ease-out backwards; }
  @keyframes bloom {
    from { transform: scale(0); opacity:0; }
    to { transform: scale(1); opacity:1; }
  }
  .leaf { position:absolute; background:#8fb07a; border-radius: 0 60% 0 60%; animation: leafsway 5s ease-in-out infinite; }
  @keyframes leafsway { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(8deg);} }

  /* ---- Гусенички (статичные) ---- */
  .caterpillar { position: fixed; z-index:3; display:flex; align-items:center; gap:2px; pointer-events:none; }
  .seg { width:16px; height:16px; border-radius:50%; }
  .caterpillar .head { width:20px; height:20px; position:relative; }
  .eye { position:absolute; width:4px; height:4px; background:#3a2e1f; border-radius:50%; top:5px; }
  .eye.l { left:3px; } .eye.r { right:3px; }
  .nose { position:absolute; width:5px; height:4px; background:#f2a7b3; border-radius:50%; left:7px; top:11px; }
  .c-green .seg, .c-green .head { background:#a8c686; }
  .c-pink .seg, .c-pink .head { background:#f2b8c6; }
  .c-yellow .seg, .c-yellow .head { background:#f5dd9a; }

  /* ---- Календарь ---- */
  .card {
    max-width: 560px; margin: 0 auto;
    background: rgba(255,255,255,.75);
    border: 1px solid #cfe0bf;
    border-radius: 22px; padding: 26px 24px;
    box-shadow: 0 10px 30px rgba(90,120,80,.12);
  }
  .cal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-head button {
    background:#dfeccc; border:none; color:#3e5a40; font-size:18px;
    width:38px; height:38px; border-radius:50%; cursor:pointer; transition: background .2s;
  }
  .cal-head button:hover { background:#cfe0b4; }
  .cal-title { font-size:20px; font-weight:bold; color:#2c5e3a; }
  .cal-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
  .dow { text-align:center; font-size:13px; color:#7a937c; padding:4px 0; }
  .day {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-size:15px; cursor:pointer; transition: all .18s;
    background:#f2f7ea; color:#3e5a40;
  }
  .day:hover:not(.disabled) { background:#dfeccc; }
  .day.disabled { color:#c3cfc2; cursor:default; background:transparent; }
  .day.in-range { background:#cfe3bd; }
  .day.start, .day.end { background:#8fb07a; color:#fff; font-weight:bold; }
  .hint { text-align:center; font-size:14px; color:#6d8a6f; margin-top:14px; }
  .selected-label { text-align:center; font-size:16px; color:#2c5e3a; margin-top:8px; min-height:22px; }

  .btn {
    display:block; margin: 26px auto 0;
    padding: 14px 46px; font-size:17px; font-family: inherit;
    background: linear-gradient(135deg,#a8c686,#8fb07a);
    color:#fff; border:none; border-radius: 30px; cursor:pointer;
    box-shadow: 0 6px 16px rgba(120,150,100,.35);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 9px 20px rgba(120,150,100,.45); }
  .btn:active { transform: translateY(0); }

  /* ---- Предпочтения ---- */
  .options { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:14px; max-width:640px; margin:26px auto; }
  .option {
    padding:16px 20px; background: rgba(255,255,255,.8);
    border: 2px solid #d5e4c4; border-radius: 16px;
    font-size:17px; color:#3e5a40; cursor:pointer; text-align:center;
    transition: all .2s; font-family: inherit;
  }
  .option:hover { border-color:#a8c686; transform: translateY(-2px); }
  .option.selected { background: linear-gradient(135deg,#a8c686,#8fb07a); color:#fff; border-color:#8fb07a; }

  /* ---- Пожелания ---- */
  textarea {
    width:100%; min-height:130px; padding:14px; font-size:16px;
    border:2px solid #d5e4c4; border-radius:14px; resize:vertical;
    font-family:inherit; color:#3e5a40; background:rgba(255,255,255,.9);
  }
  textarea:focus { outline:none; border-color:#a8c686; }
  .summary { background:rgba(255,255,255,.8); border-radius:14px; padding:16px 18px; margin-bottom:18px; font-size:16px; line-height:1.6; }
  .status { text-align:center; margin-top:14px; font-size:15px; color:#4c7a4f; min-height:20px; }
</style>
</head>
<body>
<div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div>

<!-- Гусенички -->
<div class="caterpillar c-green" style="left:40px; bottom:60px;"></div>
<div class="caterpillar c-pink" style="right:60px; top:120px; transform:scaleX(-1);"></div>
<div class="caterpillar c-yellow" style="left:20%; top:45%;"></div>

<!-- Стр. 1: даты -->
<section id="page-dates" class="page active">
  <div class="emblem" id="emblem"></div>
  <h1>ДЛЯ АНАСТАСИЙКИ</h1>
  <p class="subtitle">Выберите удобные даты</p>
  <div class="card">
    <div class="cal-head">
      <button onclick="shiftMonth(-1)">&#8592;</button>
      <div class="cal-title" id="calTitle"></div>
      <button onclick="shiftMonth(1)">&#8594;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="selected-label" id="rangeLabel">Даты не выбраны</div>
    <button class="btn" onclick="goPreferences()">Далее</button>
  </div>
</section>

<!-- Стр. 2: предпочтения -->
<section id="page-prefs" class="page">
  <h2>Выберите ваши предпочтения:</h2>
  <p class="subtitle">Можно выбрать несколько вариантов</p>
  <div class="options" id="options"></div>
  <button class="btn" onclick="goWishes()">Далее</button>
</section>

<!-- Стр. 3: пожелания -->
<section id="page-wishes" class="page">
  <h2>Ваши пожелания</h2>
  <div class="card">
    <div class="summary" id="summary"></div>
    <textarea id="wishesText" placeholder="Напишите ваши пожелания..."></textarea>
    <button class="btn" onclick="sendWishes()">Отправить</button>
    <div class="status" id="status"></div>
  </div>
</section>

<script>
const EMAIL = 'denkanat00@gmail.com';

/* ---------- Цветочная эмблема ---------- */
function buildEmblem(){
  const em = document.getElementById('emblem');
  const gerbera = (color, core) => `<svg viewBox="0 0 100 100" width="100" height="100">
    ${Array.from({length:22},(_,i)=>{
      const a = i*16.4;
      return `<ellipse cx="50" cy="26" rx="7" ry="20" fill="${color}" opacity="0.95"
        transform="rotate(${a} 50 50)"/>`;
    }).join('')}
    <circle cx="50" cy="50" r="14" fill="${core}"/>
    <circle cx="50" cy="50" r="8" fill="${color}" opacity=".6"/>
  </svg>`;
  const eustoma = `<svg viewBox="0 0 100 100" width="72" height="72">
    ${Array.from({length:6},(_,i)=>`<ellipse cx="50" cy="30" rx="16" ry="22" fill="#f4f2ec"
      transform="rotate(${i*60} 50 50)"/>`).join('')}
    <circle cx="50" cy="50" r="10" fill="#e9e2b8"/>
  </svg>`;
  const items = [
    {svg:gerbera('#f2a0b5','#7a4a2a'), l:6,  t:34, d:0},
    {svg:eustoma,                      l:28, t:10, d:.3},
    {svg:gerbera('#f6cf5d','#6b4a1e'), l:62, t:34, d:.6},
    {svg:gerbera('#f6cf5d','#6b4a1e'), l:14, t:64, d:.9},
    {svg:eustoma,                      l:42, t:72, d:1.2},
    {svg:gerbera('#f2a0b5','#7a4a2a'), l:68, t:62, d:1.5},
  ];
  items.forEach((it,i)=>{
    const w = document.createElement('div');
    w.className = 'flower bloom';
    w.style.cssText = `left:${it.l}%; top:${it.t}%; animation-delay:${i*.22}s, ${it.d}s;`;
    w.innerHTML = it.svg;
    em.appendChild(w);
  });
  // листочки
  const leafPos = [[20,50,-30],[50,4,10],[80,50,30],[35,88,20],[62,88,-20]];
  leafPos.forEach((p,i)=>{
    const lf = document.createElement('div');
    lf.className = 'leaf';
    lf.style.cssText = `left:${p[0]}%; top:${p[1]}%; width:34px; height:16px; transform:rotate(${p[2]}deg); animation-delay:${i*.4}s;`;
    em.appendChild(lf);
  });
}
buildEmblem();

/* ---------- Гусенички (статичные) ---------- */
function buildCaterpillars(){
  document.querySelectorAll('.caterpillar').forEach(c=>{
    const segColors = ['#8fb07a'];
    let html = '';
    for(let i=0;i<4;i++){
      const s = 16 - i*2;
      html += `<div class="seg" style="width:${s}px;height:${s}px;opacity:${1-i*.12}"></div>`;
    }
    html += `<div class="head"><div class="eye l"></div><div class="eye r"></div><div class="nose"></div></div>`;
    c.innerHTML = html;
  });
}
buildCaterpillars();

/* ---------- Календарь с диапазоном ---------- */
let view = new Date(); view.setDate(1);
let rangeStart = null, rangeEnd = null;

function shiftMonth(d){ view.setMonth(view.getMonth()+d); renderCal(); }

function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

function renderCal(){
  const grid = document.getElementById('calGrid');
  const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('calTitle').textContent = months[view.getMonth()] + ' ' + view.getFullYear();
  grid.innerHTML = '';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d=>{
    const el = document.createElement('div'); el.className='dow'; el.textContent=d; grid.appendChild(el);
  });
  const first = (new Date(view.getFullYear(), view.getMonth(), 1).getDay() + 6) % 7;
  const days = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  for(let i=0;i<first;i++) grid.appendChild(document.createElement('div'));
  const today = new Date(); today.setHours(0,0,0,0);
  for(let d=1; d<=days; d++){
    const date = new Date(view.getFullYear(), view.getMonth(), d);
    const el = document.createElement('div');
    el.className='day'; el.textContent=d;
    if(date < today){ el.classList.add('disabled'); }
    else {
      if(rangeStart && rangeEnd){
        if(sameDay(date,rangeStart)||sameDay(date,rangeEnd)) el.classList.add(rangeStart===rangeEnd?'start':'start end'.split(' ')[0]);
        if(sameDay(date,rangeStart)) el.classList.add('start');
        if(sameDay(date,rangeEnd)) el.classList.add('end');
        if(date>rangeStart && date<rangeEnd) el.classList.add('in-range');
      } else if(rangeStart && sameDay(date,rangeStart)){
        el.classList.add('start');
      }
      el.onclick = ()=> pickDay(date);
    }
    grid.appendChild(el);
  }
  const lbl = document.getElementById('rangeLabel');
  const fmt = x => x ? x.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}) : null;
  if(rangeStart && rangeEnd) lbl.textContent = `Выбрано: ${fmt(rangeStart)} — ${fmt(rangeEnd)}`;
  else if(rangeStart) lbl.textContent = `Начало: ${fmt(rangeStart)} — выберите дату окончания`;
  else lbl.textContent = 'Даты не выбраны';
}

function pickDay(date){
  if(!rangeStart || (rangeStart && rangeEnd)){
    rangeStart = date; rangeEnd = null;
  } else if(date < rangeStart){
    rangeStart = date;
  } else {
    rangeEnd = date;
  }
  renderCal();
}
renderCal();

function goPreferences(){
  if(!rangeStart){ alert('Пожалуйста, выберите дату'); return; }
  if(!rangeEnd){ alert('Пожалуйста, выберите дату окончания'); return; }
  showPage('page-prefs');
}

/* ---------- Предпочтения ---------- */
const PREFS = ['Суши','Пицца','Кофейня','Паста','Десерты и кондитерская','Кино','Театр или концерт','Прогулка по парку'];
let selected = new Set();
const optBox = document.getElementById('options');
PREFS.forEach(p=>{
  const b = document.createElement('button');
  b.className='option'; b.textContent=p;
  b.onclick = ()=>{
    if(selected.has(p)){ selected.delete(p); b.classList.remove('selected'); }
    else { selected.add(p); b.classList.add('selected'); }
  };
  optBox.appendChild(b);
});

function goWishes(){
  if(selected.size===0){ alert('Пожалуйста, выберите хотя бы один вариант'); return; }
  const fmt = x => x.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('summary').innerHTML =
    `<b>Даты:</b> ${fmt(rangeStart)} — ${fmt(rangeEnd)}<br><b>Предпочтения:</b> ${[...selected].join(', ')}`;
  showPage('page-wishes');
}

/* ---------- Отправка на почту ---------- */
function sendWishes(){
  const wishes = document.getElementById('wishesText').value.trim();
  const status = document.getElementById('status');
  if(!wishes){ alert('Пожалуйста, напишите пожелания'); return; }
  const fmt = x => x.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  const body = `Даты: ${fmt(rangeStart)} — ${fmt(rangeEnd)}\nПредпочтения: ${[...selected].join(', ')}\n\nПожелания:\n${wishes}`;
  status.textContent = 'Отправляю...';
  fetch('https://formsubmit.co/ajax/' + EMAIL, {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({
      _subject: 'Новые пожелания для Анастасийки 🌸',
      message: body
    })
  })
  .then(r=>r.json())
  .then(()=>{
    status.textContent = 'Пожелания отправлены! Спасибо 🌸';
    document.getElementById('wishesText').value = '';
  })
  .catch(()=>{
    status.textContent = 'Не удалось отправить. Проверьте подключение к интернету и попробуйте ещё раз.';
  });
}

/* ---------- Переключение страниц ---------- */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
